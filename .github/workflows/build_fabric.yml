name: 测试Fabric(jar)

on:
  workflow_dispatch:

permissions:
  contents: write
env:
  JAVA_21_RULE: ">=fabric-1.16.5,>=neoforge-1.20.2"
  JAVA_17_RULE: ">=forge-1.17"
  JAVA_8_RULE: "=forge-1.16.5"
jobs:

  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate Matrix
        id: set-matrix
        run: |
          chmod 777 matrix.sh
          ./matrix.sh -path "fabric"

  build:
    runs-on: ubuntu-latest
    needs: generate-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Get JDK Version
        run: chmod 777 jdk_rules.sh && ./jdk_rules.sh "${{ matrix.config.mc-loader }}" "${{ matrix.config.mc-version }}" "${{ env.JAVA_21_RULE }}" "${{ env.JAVA_17_RULE }}" "${{ env.JAVA_8_RULE }}"

      - name: Chose JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Read version.txt and save to variable
        run: |
          mod_version=$(cat version.txt)
          echo "Version: $mod_version"
          echo "MOD_VERSION=$mod_version" >> "$GITHUB_ENV"
      - name: Init Files
        run: |
          chmod 777 init.sh && ./init.sh
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ matrix.config.mc-version }}+${{ matrix.config.mc-loader }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ matrix.config.mc-version }}+${{ matrix.config.mc-loader }}-gradle-
      - name: Publish ActionLib 1.3.2 to Maven Local
        if: matrix.config.mc-loader == 'fabric' && matrix.config.mc-version == '26.2'
        run: |
          git clone --branch fabric-26.2 --depth 1 https://github.com/raincatsanddogs/ActionLib.git ../ActionLib
          cd ../ActionLib
          chmod 777 gradlew
          for attempt in 1 2 3; do
            if ./gradlew clean publishToMavenLocal; then
              break
            fi
            if [[ "$attempt" == "3" ]]; then
              exit 1
            fi
            echo "::warning::ActionLib build attempt $attempt failed; retrying in 15 seconds."
            sleep 15
          done
      - name: Build
        run: |
          cd ${{ matrix.config.mc-loader }}/${{ matrix.config.mc-loader }}-${{ matrix.config.mc-version }}
          chmod 777 gradlew
          for attempt in 1 2 3; do
            if ./gradlew clean build; then
              break
            fi
            if [[ "$attempt" == "3" ]]; then
              exit 1
            fi
            echo "::warning::Gradle build attempt $attempt failed; retrying in 15 seconds."
            sleep 15
          done
          cd ../..
      - uses: actions/upload-artifact@v4
        with:
          name: ChatImage-${{ env.MOD_VERSION }}+${{ matrix.config.mc-version }}+${{ matrix.config.mc-loader }}.jar
          path: ChatImage-jar/${{ env.MOD_VERSION }}/ChatImage-${{ env.MOD_VERSION }}+${{ matrix.config.mc-version }}+${{ matrix.config.mc-loader }}.jar
